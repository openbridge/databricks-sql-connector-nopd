[tool.poetry]
name = "databricks-sql-connector-nopd"
version = "4.0.2"
description = "Databricks SQL Connector for Python (No Pandas requirement)"
authors = ["Databricks <databricks-sql-connector-maintainers@databricks.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "databricks", from = "src" }]
include = ["CHANGELOG.md"]

[tool.poetry.dependencies]
python = "^3.8.0"
thrift = ">=0.16.0,<0.21.0"
pandas = [
  { version = ">=1.2.5,<2.3.0", python = ">=3.8,<3.13" },
  { version = ">=2.2.3,<2.3.0", python = ">=3.13" },
]
lz4 = "^4.0.2"
requests = "^2.18.1"
oauthlib = "^3.1.0"
openpyxl = "^3.0.10"
urllib3 = ">=1.26"
pyarrow = [
  { version = ">=14.0.1", python = ">=3.8,<3.13", optional = true },
  { version = ">=18.0.0", python = ">=3.13", optional = true },
]
python-dateutil = "^2.8.0"

[tool.poetry.extras]
pyarrow = ["pyarrow"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.1.2"
mypy = "^1.10.1"
pylint = ">=2.12.0"
black = "^22.3.0"
pytest-dotenv = "^0.5.2"
numpy = [
  { version = ">=1.16.6", python = ">=3.8,<3.11", optional = true },
  { version = ">=1.23.4", python = ">=3.11", optional = true },
]
tox = "~4.15.0"
commitizen = { version = "4.16.5", python = ">=3.10" }

[tool.poetry.urls]
"Homepage" = "https://github.com/databricks/databricks-sql-python"
"Bug Tracker" = "https://github.com/databricks/databricks-sql-python/issues"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "poetry"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_incremental = true
bump_message = "chore(release): bump version $new_version [skip release]"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
ignore_missing_imports = "true"
exclude = ['ttypes\.py$', 'TCLIService\.py$']

[tool.black]
exclude = '/(\.eggs|\.git|\.hg|\.mypy_cache|\.nox|\.tox|\.venv|\.svn|_build|buck-out|build|dist|thrift_api)/'

# [tool.pytest.ini_options]
# markers = {"reviewed" = "Test case has been reviewed by Databricks"}
# minversion = "6.0"
# log_cli = "false"
# log_cli_level = "INFO"
# testpaths = ["tests"]
# env_files = ["test.env"]

[tool.tox]
legacy_tox_ini = """
[tox]
isolated_build = true
envlist = pytest

[testenv]
allowlist_externals = poetry
setenv   =
    AWS_DEFAULT_REGION = us-east-1
commands =
    poetry install -v
    poetry run pytest

[testenv:pytest]
allowlist_externals = echo
setenv   =
    AWS_DEFAULT_REGION = us-east-1
commands =
    echo "There is no unit tests written"
"""
